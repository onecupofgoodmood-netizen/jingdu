services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env.production
    restart: unless-stopped
    volumes:
      - ./backend/data:/app/data
      - ./backend/downloads:/app/downloads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: ./frontend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
